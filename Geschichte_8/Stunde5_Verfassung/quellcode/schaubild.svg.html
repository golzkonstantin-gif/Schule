<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
svg{display:block;font-family:Carlito,Calibri,"Liberation Sans",sans-serif}
.h{font-size:30px;font-weight:700;fill:#fff}
.b{font-size:36px;font-weight:700;fill:#1E2761}
.n{font-size:25px;fill:#1E2761}
.a{font-size:24px;font-style:italic;fill:#3D4A6B;stroke:#fff;stroke-width:8px;paint-order:stroke}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#5B6B8C"/></marker></defs>
<rect width="1600" height="800" fill="#fff"/>
<!-- Spaltenköpfe -->
<g><rect x="20" y="4" width="440" height="80" rx="10" fill="#D9534F"/><text class="h" x="240" y="38" text-anchor="middle">Vollziehende Gewalt</text><text x="240" y="68" text-anchor="middle" style="font-size:22px;fill:#fff">Exekutive: führt die Gesetze aus, regiert</text>
<rect x="580" y="4" width="440" height="80" rx="10" fill="#3F7CC4"/><text class="h" x="800" y="38" text-anchor="middle">Gesetzgebende Gewalt</text><text x="800" y="68" text-anchor="middle" style="font-size:22px;fill:#fff">Legislative: macht die Gesetze</text>
<rect x="1140" y="4" width="440" height="80" rx="10" fill="#2E9E6B"/><text class="h" x="1360" y="38" text-anchor="middle">Richterliche Gewalt</text><text x="1360" y="68" text-anchor="middle" style="font-size:22px;fill:#fff">Judikative: urteilt nach den Gesetzen</text></g>
<!-- Kästen -->
<g><rect x="20" y="90" width="440" height="100" rx="12" fill="#FDECEA" stroke="#D9534F" stroke-width="3"/><text class="b" x="240" y="132" text-anchor="middle">König</text><text class="n" x="240" y="168" text-anchor="middle">erblich</text>
<rect x="20" y="250" width="440" height="100" rx="12" fill="#FDECEA" stroke="#D9534F" stroke-width="3"/><text class="b" x="240" y="292" text-anchor="middle">Regierung</text><text class="n" x="240" y="328" text-anchor="middle">Minister</text>
<rect x="20" y="410" width="440" height="80" rx="12" fill="#FDECEA" stroke="#D9534F" stroke-width="3"/><text class="b" x="240" y="462" text-anchor="middle">Verwaltungsbeamte</text></g>
<g><rect x="580" y="90" width="440" height="140" rx="12" fill="#EAF0FA" stroke="#3F7CC4" stroke-width="3"/><text class="b" x="800" y="132" text-anchor="middle">Nationalversammlung</text><text class="n" x="800" y="172" text-anchor="middle">745 Abgeordnete</text><text class="n" x="800" y="204" text-anchor="middle">beschließen Gesetze</text>
<rect x="580" y="290" width="440" height="200" rx="12" fill="#EAF0FA" stroke="#3F7CC4" stroke-width="3"/><text class="b" x="800" y="332" text-anchor="middle">Wahlmänner</text><text class="n" x="800" y="370" text-anchor="middle">Männer mit Grundbesitz,</text><text class="n" x="800" y="402" text-anchor="middle">Steuern im Wert von</text><text class="n" x="800" y="434" text-anchor="middle">mindestens 10 Arbeitstagen</text><text class="n" x="800" y="466" text-anchor="middle">(etwa 50 000 Personen)</text></g>
<g><rect x="1140" y="90" width="440" height="100" rx="12" fill="#E5F5EE" stroke="#2E9E6B" stroke-width="3"/><text class="b" x="1360" y="152" text-anchor="middle">Oberstes Gericht</text>
<rect x="1140" y="410" width="440" height="80" rx="12" fill="#E5F5EE" stroke="#2E9E6B" stroke-width="3"/><text class="b" x="1360" y="462" text-anchor="middle">Gerichte</text></g>
<!-- Bürger -->
<g><rect x="20" y="560" width="1560" height="100" rx="14" fill="#1E2761"/><text x="800" y="606" text-anchor="middle" style="font-size:40px;font-weight:700;fill:#fff">Aktivbürger (ca. 4,3 Millionen)</text><text x="800" y="644" text-anchor="middle" style="font-size:26px;fill:#CADCFC">Männer über 25 Jahre, die Steuern im Wert von drei Arbeitstagen zahlen</text>
<rect x="20" y="690" width="1560" height="100" rx="14" fill="#5B6B8C"/><text x="800" y="736" text-anchor="middle" style="font-size:40px;font-weight:700;fill:#fff">Passivbürger (ca. 22 Millionen)</text><text x="800" y="774" text-anchor="middle" style="font-size:26px;fill:#E6EAF3">alle Frauen und Männer ohne oder mit geringen Steuern: Rechte, aber kein Wahlrecht</text></g>
<!-- Pfeile -->
<g stroke="#5B6B8C" stroke-width="4" fill="none" marker-end="url(#ar)">
<line x1="240" y1="190" x2="240" y2="250"/><line x1="240" y1="350" x2="240" y2="410"/>
<line x1="800" y1="290" x2="800" y2="232"/>
<line x1="460" y1="130" x2="578" y2="130"/><line x1="578" y1="190" x2="462" y2="190"/>
<line x1="1020" y1="130" x2="1138" y2="130"/><line x1="1138" y1="190" x2="1022" y2="190"/><line x1="578" y1="452" x2="462" y2="452"/><line x1="1022" y1="452" x2="1138" y2="452"/><line x1="590" y1="232" x2="464" y2="292"/>
<line x1="240" y1="560" x2="240" y2="492"/><line x1="800" y1="560" x2="800" y2="492"/><line x1="1360" y1="560" x2="1360" y2="492"/></g>
<g class="a" text-anchor="start"><text x="256" y="226" class="a">ernennt und entlässt</text><text x="256" y="394" class="a">kontrolliert</text><text x="816" y="268" class="a">wählen alle zwei Jahre</text>
<text x="472" y="94" class="a" style="font-size:20px">Nein =</text><text x="472" y="116" class="a" style="font-size:20px">Einspruch</text><text x="472" y="220" class="a" style="font-size:21px">kontrolliert</text><text x="1034" y="118" class="a" style="font-size:21px">ruft an</text><text x="1030" y="214" class="a" style="font-size:21px">kontrolliert</text><text x="470" y="322" class="a" style="font-size:21px">kontrolliert</text>
<text x="480" y="440" class="a" style="font-size:21px">wählen</text><text x="1040" y="440" class="a" style="font-size:21px">wählen</text><text x="256" y="534" class="a">wählen</text><text x="816" y="534" class="a">wählen</text><text x="1376" y="534" class="a">wählen</text></g>
</svg></body></html>
