<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="meander" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 35 H70 V5 H20 V25 H50 V15 H40" fill="none" stroke="#D9A441" stroke-width="5"/>
    </pattern>
  </defs>
  <!-- wall -->
  <rect width="1600" height="1000" fill="#F4ECDE"/>
  <rect y="0" width="1600" height="50" fill="#2B2318"/>
  <rect y="5" width="1600" height="40" fill="url(#meander)"/>
  <!-- columns -->
  <g fill="#FBF8F2" stroke="#BFB5A5" stroke-width="4">
    <rect x="70" y="120" width="120" height="640"/>
    <rect x="50" y="90" width="160" height="40"/>
    <rect x="1410" y="120" width="120" height="640"/>
    <rect x="1390" y="90" width="160" height="40"/>
  </g>
  <g stroke="#D9CDB8" stroke-width="4">
    <line x1="100" y1="140" x2="100" y2="750"/><line x1="130" y1="140" x2="130" y2="750"/><line x1="160" y1="140" x2="160" y2="750"/>
    <line x1="1440" y1="140" x2="1440" y2="750"/><line x1="1470" y1="140" x2="1470" y2="750"/><line x1="1500" y1="140" x2="1500" y2="750"/>
  </g>
  <!-- sign -->
  <rect x="520" y="80" width="560" height="110" rx="14" fill="#2B2318"/>
  <text x="800" y="132" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="46" fill="#FFFFFF">BÜRGERAMT ATHEN</text>
  <text x="800" y="172" text-anchor="middle" font-family="Liberation Sans" font-size="24" fill="#D9A441">Schalter 1 · Archontenwahl &amp; Klasseneinstufung</text>
  <!-- number display -->
  <rect x="1180" y="230" width="190" height="110" rx="12" fill="#2B2318"/>
  <text x="1275" y="268" text-anchor="middle" font-family="Liberation Sans" font-size="22" fill="#D9A441">Aufruf Nr.</text>
  <text x="1275" y="322" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="bold" font-size="48" fill="#E8553A">594</text>

  <!-- woman: body -->
  <path d="M600 900 C600 690 660 600 800 590 C940 600 1000 690 1000 900 Z" fill="#AD4426"/>
  <path d="M700 620 C760 700 840 700 900 620" fill="none" stroke="#8E3720" stroke-width="6"/>
  <path d="M760 660 L740 900 M840 660 L860 900 M800 690 L800 900" stroke="#8E3720" stroke-width="5" fill="none"/>
  <!-- fibula -->
  <circle cx="690" cy="620" r="12" fill="#D9A441"/><circle cx="910" cy="620" r="12" fill="#D9A441"/>
  <!-- neck -->
  <rect x="770" y="520" width="60" height="80" fill="#E8B996"/>
  <!-- hair back + bun -->
  <circle cx="800" cy="330" r="80" fill="#3A2A1E"/>
  <ellipse cx="800" cy="440" rx="130" ry="140" fill="#3A2A1E"/>
  <!-- face -->
  <ellipse cx="800" cy="450" rx="105" ry="125" fill="#EFC6A4"/>
  <!-- hair front -->
  <path d="M695 430 C690 340 760 315 800 330 C840 315 910 340 905 430 C880 380 840 370 800 380 C760 370 720 380 695 430 Z" fill="#3A2A1E"/>
  <!-- headband -->
  <path d="M700 395 C760 355 840 355 900 395" fill="none" stroke="#D9A441" stroke-width="10"/>
  <!-- ears + earrings -->
  <ellipse cx="695" cy="460" rx="14" ry="22" fill="#E8B996"/><ellipse cx="905" cy="460" rx="14" ry="22" fill="#E8B996"/>
  <circle cx="695" cy="492" r="7" fill="#D9A441"/><circle cx="905" cy="492" r="7" fill="#D9A441"/>
  <!-- stern eyebrows -->
  <path d="M735 418 L785 432" stroke="#2B2318" stroke-width="9" stroke-linecap="round"/>
  <path d="M865 418 L815 432" stroke="#2B2318" stroke-width="9" stroke-linecap="round"/>
  <!-- half-moon glasses (anachronistic!) -->
  <path d="M732 452 H788 C788 482 732 482 732 452 Z" fill="#FFFFFF" fill-opacity="0.35" stroke="#2B2318" stroke-width="5"/>
  <path d="M812 452 H868 C868 482 812 482 812 452 Z" fill="#FFFFFF" fill-opacity="0.35" stroke="#2B2318" stroke-width="5"/>
  <line x1="788" y1="455" x2="812" y2="455" stroke="#2B2318" stroke-width="5"/>
  <!-- eyes looking over glasses -->
  <circle cx="760" cy="446" r="7" fill="#2B2318"/><circle cx="840" cy="446" r="7" fill="#2B2318"/>
  <!-- nose + stern mouth -->
  <path d="M800 465 L792 500 L806 502" fill="none" stroke="#C99A78" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 532 L830 528" stroke="#8E3720" stroke-width="7" stroke-linecap="round"/>
  

  <!-- desk -->
  <rect x="240" y="740" width="1120" height="260" fill="#5A5044"/>
  <rect x="220" y="720" width="1160" height="40" rx="8" fill="#2B2318"/>
  <text x="800" y="880" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="40" fill="#F4ECDE">Bitte Scheffel-Nachweis bereithalten!</text>
  <text x="800" y="930" text-anchor="middle" font-family="Liberation Sans" font-size="26" fill="#D9CDB8">Adelsurkunden werden seit 594 v. Chr. nicht mehr anerkannt.</text>

  <!-- arm with stamp -->
  <path d="M960 680 C1040 650 1080 600 1100 540" stroke="#AD4426" stroke-width="58" fill="none" stroke-linecap="round"/>
  <circle cx="1100" cy="530" r="30" fill="#EFC6A4"/>
  <rect x="1078" y="440" width="44" height="80" rx="10" fill="#7A4A2A"/>
  <rect x="1050" y="420" width="100" height="34" rx="10" fill="#5A3A22"/>
  <!-- other arm resting -->
  <path d="M640 690 C600 700 560 710 520 712" stroke="#AD4426" stroke-width="56" fill="none" stroke-linecap="round"/>
  <ellipse cx="505" cy="712" rx="32" ry="24" fill="#EFC6A4"/>

  <!-- scroll with stamp ABGELEHNT -->
  <g transform="translate(-45 0) rotate(-6 1180 690)">
    <rect x="1040" y="640" width="290" height="120" rx="10" fill="#FBF3E2" stroke="#BFB5A5" stroke-width="3"/>
    <rect x="1025" y="630" width="20" height="140" rx="10" fill="#D9CDB8"/>
    <rect x="1325" y="630" width="20" height="140" rx="10" fill="#D9CDB8"/>
    <g transform="rotate(-10 1185 700)">
      <rect x="1065" y="668" width="240" height="64" rx="6" fill="none" stroke="#E8553A" stroke-width="6"/>
      <text x="1185" y="716" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="40" fill="#E8553A">ABGELEHNT</text>
    </g>
  </g>

  <!-- scroll stack left -->
  <g>
    <rect x="280" y="660" width="200" height="34" rx="17" fill="#FBF3E2" stroke="#BFB5A5" stroke-width="3"/>
    <rect x="300" y="626" width="190" height="34" rx="17" fill="#FBF3E2" stroke="#BFB5A5" stroke-width="3"/>
    <rect x="290" y="592" width="180" height="34" rx="17" fill="#FBF3E2" stroke="#BFB5A5" stroke-width="3"/>
    <rect x="310" y="558" width="170" height="34" rx="17" fill="#FBF3E2" stroke="#BFB5A5" stroke-width="3"/>
    <text x="380" y="545" text-anchor="middle" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#5A5044">Anträge</text>
  </g>
  <!-- coffee amphora -->
  <g transform="translate(1345 575)">
    <path d="M10 0 H50 V20 C80 40 80 120 30 150 C-20 120 -20 40 10 20 Z" fill="#AD4426" stroke="#2B2318" stroke-width="4"/>
    <path d="M10 25 C-25 30 -20 70 0 70" fill="none" stroke="#2B2318" stroke-width="5"/>
    <path d="M50 25 C85 30 80 70 60 70" fill="none" stroke="#2B2318" stroke-width="5"/>
    <text x="30" y="95" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#F4ECDE">ΚΑΦΕΣ</text>
    <path d="M22 -12 C18 -28 34 -30 30 -46 M40 -12 C36 -28 52 -30 48 -46" stroke="#998C77" stroke-width="3" fill="none"/>
  </g>

  <!-- speech bubble -->
  <path d="M260 230 H660 Q690 230 690 260 V380 Q690 410 660 410 H470 L430 470 L430 410 H260 Q230 410 230 380 V260 Q230 230 260 230 Z" fill="#FFFFFF" stroke="#2B2318" stroke-width="5"/>
  <text x="460" y="290" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="30" fill="#2B2318">Unter 500 Scheffeln?</text>
  <text x="460" y="335" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="30" fill="#2B2318">Kein Archont.</text>
  <text x="460" y="385" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-size="30" fill="#AD4426">Der Nächste, bitte!</text>
</svg>
